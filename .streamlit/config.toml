[theme]
base = "light"
primaryColor = "#7B4FA8"
backgroundColor = "#FBF8F5"
secondaryBackgroundColor = "#F3ECF4"
textColor = "#2A2033"
linkColor = "#7B4FA8"
borderColor = "#E7DCE6"
showWidgetBorder = true
baseRadius = "14px"
buttonRadius = "999px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
headingFont = "'Cormorant Garamond':https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
chartCategoricalColors = ["#7B4FA8", "#C9A36B", "#D58BA8", "#5E8C9A", "#B98AD9"]

[theme.sidebar]
backgroundColor = "#221137"
secondaryBackgroundColor = "#33194D"
textColor = "#EDE4F1"
borderColor = "#3A2A48"
primaryColor = "#E2C48F"
